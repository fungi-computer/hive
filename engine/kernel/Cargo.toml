[package]
name = "hive-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Headless Bevy-backed simulation kernel for Hive"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.128"
pathfinding = "=4.16.0"
glam = "=0.33.7"
parry3d-f64 = { version = "=0.30.2", default-features = false, features = ["required-features", "std", "enhanced-determinism"] }

[profile.release]
lto = true
codegen-units = 1
