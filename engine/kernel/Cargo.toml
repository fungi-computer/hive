[package]
name = "hive-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Headless Bevy-backed simulation kernel for Hive"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bevy_ecs = "0.19.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.128"

[profile.release]
lto = true
codegen-units = 1
