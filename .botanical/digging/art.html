<!doctype html><html><style>body{background:#293d35;color:#eee;font:16px sans-serif;margin:24px}section{display:flex;flex-wrap:wrap;gap:16px}figure{margin:0}canvas{image-rendering:pixelated;background:#30453b;max-width:100%;height:auto}h2{margin:10px 0}</style><body><h1>Digging — original terrain and work poses</h1><section id="terrain"></section><h2>Digging and soil carrying — 2× native pixels</h2><section id="people"></section><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {bake} from '/src/art.js';
import {clearing} from '/src/art/clearing.js';
import {figure} from '/src/art/figures.js';
import {soilPile} from '/src/art/soil.js';
import {worldCamera,camera,WIDTH,HEIGHT} from '/src/art/scale.js';
import {authoredClearingTerrain,removeShallowVoxel} from '/src/terrain.ts';
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
window.evidence={bakes:[],alpha:[],errors:[]};
function draw(scene,cam,w,h,target,title,scale=1){const t=performance.now();const tex=bake(renderer,scene,cam,w,h,false);const source=tex.source.resource;const f=document.createElement('figure');const c=document.createElement('canvas');c.width=w;c.height=h;c.style.width=`${w*scale}px`;const ctx=c.getContext('2d');ctx.drawImage(source,0,0);const cap=document.createElement('figcaption');cap.textContent=title;f.append(c,cap);document.querySelector(target).append(f);window.evidence.bakes.push({title,ms:performance.now()-t});const rgba=ctx.getImageData(0,0,w,h).data;let minX=w,minY=h,maxX=-1,maxY=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(rgba[(y*w+x)*4+3]){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);}window.evidence.alpha.push({title,minX,minY,maxX,maxY});tex.destroy(true);}
const terrain=authoredClearingTerrain();removeShallowVoxel(terrain,{x:7,z:8,level:0});draw(clearing(terrain),worldCamera,WIDTH,HEIGHT,'#terrain','One 0.54 m pit');for(const x of [8,9])removeShallowVoxel(terrain,{x,z:8,level:0});draw(clearing(terrain),worldCamera,WIDTH,HEIGHT,'#terrain','Three connected cuts');
for(const kind of ['rowan','witch-runner'])for(const pose of ['dig','carry-soil'])for(const dir of [0,1,2,3])draw(figure(kind,3/8,dir*Math.PI/2,pose),camera(80,80),80,80,'#people',`${kind} ${pose} ${dir}`,2);
draw(soilPile(1),camera(112,112,1.1),112,112,'#people','Loose spoil',2);renderer.dispose();window.ready=true;
</script></body></html>
